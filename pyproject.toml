[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "asyncio-udp-engine"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["psycopg[binary,pool]>=3.2,<4", "uvloop>=0.19; platform_system != 'Windows'"]

[tool.setuptools.packages.find]
where = ["src"]
